
name: Ad Blocker V5 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java setup
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle setup
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Android SDK setup
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install required SDK packages
      - name: Install Android SDK 35
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

      # 6. Find V5 ZIP
      - name: Find Source ZIP
        run: |
          ZIP_FILE=$(find . -type f \
            -name "AdBlockerAndroid_Complete_Source_v5.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V5 ZIP not found!"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 7. Extract ZIP
      - name: Extract Android Project
        run: |
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted \
            -type f \
            -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 8. Verify project
      - name: Verify Android Project
        run: |
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/adblocker/mobile/AdDomainFilter.kt"

      # 9. Build APK
      - name: Build Android APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      # 10. Check APK
      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-V5-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
