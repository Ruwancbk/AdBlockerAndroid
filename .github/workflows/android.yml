
name: Build Ad Blocker Debug and Release APKs

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test and Build Android APKs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./AdBlockerAndroid

    steps:
      # 1. Checkout source
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 4. Check signing key
      - name: Verify signing keystore
        run: |
          test -f app/adblocker.keystore
          echo "Original signing key found."

      # 5. Run unit tests
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      # 6. Build both APKs
      - name: Build Debug and Release APKs
        run: |
          gradle --no-daemon assembleDebug assembleRelease

      # 7. Verify APK files
      - name: Verify APK outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          echo "Both APKs built successfully!"

      # 8. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-Debug-APK
          path: AdBlockerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 9. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-Release-APK
          path: AdBlockerAndroid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
