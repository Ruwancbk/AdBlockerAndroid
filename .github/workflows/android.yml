
name: Ad Blocker V5 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Use SDK already installed on GitHub runner
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

      - name: Check Android Packages
        run: |
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Find V5 ZIP
        run: |
          ZIP_FILE=$(find . -type f \
            -name "AdBlockerAndroid_Complete_Source_v5.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "V5 ZIP NOT FOUND"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted \
            -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)

          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Project
        run: |
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-V5-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
