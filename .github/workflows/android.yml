
name: Build Ad Blocker Debug and Release APKs

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test and Build Android APKs
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 4. Check original signing key
      - name: Verify signing keystore
        shell: bash
        run: |
          if [ ! -f app/adblocker.keystore ]; then
            echo "ERROR: Original signing key not found!"
            exit 1
          fi
          echo "Original signing key found."

      # 5. Run unit tests
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      # 6. Build Debug APK
      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      # 7. Build Release APK
      - name: Build Release APK
        run: gradle --no-daemon assembleRelease

      # 8. Verify APK files
      - name: Verify APK outputs
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk

          echo "Both APK files created successfully."
          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/apk/release/

      # 9. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 10. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
