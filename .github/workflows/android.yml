      - name: Unzip source
        run: |
          echo "Zip files in repo:"
          ls -la *.zip || true
          ZIP=AdBlockerAndroid_Complete_Source_v5.zip
          if [ ! -f "$ZIP" ]; then
            echo "::error::$ZIP not found in the repository root. Upload it first."
            exit 1
          fi
          echo "Using $ZIP"
          mkdir -p extracted
          unzip -q -o "$ZIP" -d extracted
          GRADLE_FILE=$(find extracted -name settings.gradle.kts | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::settings.gradle.kts not found inside the zip."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Project folder: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Use SDK already installed on GitHub runner
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

      - name: Check Android Packages
        run: |
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Find V5 ZIP
        run: |
          ZIP_FILE=$(find . -type f \
            -name "AdBlockerAndroid_Complete_Source_v5.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "V5 ZIP NOT FOUND"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted \
            -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)

          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Project
        run: |
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-V5-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
