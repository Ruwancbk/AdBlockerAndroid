name: AdBlocker Android - Debug and Release

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test and Build Android APKs
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 4. Automatically find Android project
      - name: Detect Android project folder
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 4 \
            -type f -name settings.gradle.kts \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      # 5. Verify project files and signing key
      - name: Verify project and signing key
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/adblocker.keystore

          echo "Project files found."
          echo "Original signing key found."

      # 6. Run unit tests
      - name: Run unit tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon testDebugUnitTest

      # 7. Build Debug and Release APKs
      - name: Build both APKs
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug assembleRelease

      # 8. Verify APK files
      - name: Verify APK outputs
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk

          echo "Both APKs created successfully!"

          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/apk/release/

      # 9. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 10. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
