name: Build Ad Blocker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repository root. Upload the source zip first."
            exit 1
          fi
          echo "Unzipping $ZIP"
          mkdir -p extracted
          unzip -q -o "$ZIP" -d extracted
          GRADLE_FILE=$(find extracted -name settings.gradle.kts | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::settings.gradle.kts not found inside the zip."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Project folder: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          grep -E '^e: ' build.log | sed -E 's#file://[^ ]*/##' | head -20 > errors.txt || true
          {
            echo "### Kotlin errors"
            echo '```'
            cat errors.txt
            echo '```'
            echo "### What went wrong"
            echo '```'
            grep -A6 'What went wrong' build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do echo "::error::$line"; done < errors.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
