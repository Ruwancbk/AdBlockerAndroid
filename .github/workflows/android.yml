name: AdBlocker APK Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Extract, Test and Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find and extract Android ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android source ZIP not found!"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/adblocker_source"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE=$(find "$EXTRACT_DIR" \
            -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project settings file not found!"
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app Gradle file not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project extracted successfully!"
          echo "Project path: $PROJECT_DIR"

      - name: Verify project and signing key
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f app/adblocker.keystore ]; then
            echo "ERROR: Original signing key not found!"
            exit 1
          fi

          echo "Original signing key found."

      - name: Run unit tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon testDebugUnitTest

      - name: Build Debug and Release APKs
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug assembleRelease

      - name: Verify APK files
        shell: bash
        run: |
          set -euo pipefail

          test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          echo "Both APKs built successfully!"

          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/"
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/release/"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
